<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Cybersecurity AI Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f4f7f9;
            margin: 0;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
        }
        .form-container {
            max-width: 600px;
            margin: 0 auto;
            background: #fff;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input { width: 100%; padding: 8px; margin-top: 5px; border-radius: 5px; border: 1px solid #ccc; }
        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #2980b9;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover { background-color: #1c5980; }

        .results {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            margin-top: 30px;
            max-width: 800px;
            margin-left: auto;
            margin-right: auto;
        }
        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin: 10px;
            flex: 1 1 180px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
            text-align: center;
            font-size: 18px;
        }
        .normal { color: green; font-weight: bold; }
        .attack, .block, .anomaly { color: red; font-weight: bold; }
        .allow { color: blue; font-weight: bold; }
        .icon { font-size: 32px; display: block; margin-bottom: 10px; }
    </style>
</head>
<body>
    <h1>Cybersecurity AI Dashboard</h1>
    <div class="form-container">
        <label>Duration</label>
        <input type="number" id="Duration" step="any">
        <label>Src Port</label>
        <input type="number" id="Src_Pt">
        <label>Dst Port</label>
        <input type="number" id="Dst_Pt">
        <label>Bytes</label>
        <input type="number" id="Bytes">
        <label>Bytes per Packet</label>
        <input type="number" id="bytes_per_packet">
        <button onclick="sendData()">Predict</button>
    </div>

    <div class="results" id="results">
        <!-- Cards will appear here -->
    </div>

    <script>
        async function sendData() {
            const data = {
                Duration: parseFloat(document.getElementById('Duration').value),
                Src_Pt: parseInt(document.getElementById('Src_Pt').value),
                Dst_Pt: parseInt(document.getElementById('Dst_Pt').value),
                Bytes: parseFloat(document.getElementById('Bytes').value),
                bytes_per_packet: parseFloat(document.getElementById('bytes_per_packet').value)
            };

            const response = await fetch('/predict/all', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            });

            const result = await response.json();
            const resultsDiv = document.getElementById('results');
            resultsDiv.innerHTML = '';

            const models = ['supervised', 'unsupervised', 'rl', 'drl'];
            models.forEach(m => {
                let label = result[m];
                let icon = '';
                if (label === 'NORMAL' || label === 'ALLOW') icon = '✅';
                else if (label === 'ATTACK' || label === 'BLOCK' || label === 'ANOMALY') icon = '❌';
                resultsDiv.innerHTML += `
                    <div class="card ${label.toLowerCase()}">
                        <span class="icon">${icon}</span>
                        <div class="model-name">${m.toUpperCase()}</div>
                        <div class="prediction">${label}</div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
